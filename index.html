<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>하이케어솔루션 입문매니저 CS평가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --mist:#EEF3F0;
    --mist-deep:#E2EAE5;
    --ink:#1C2B27;
    --ink-soft:#4C5C57;
    --brick:#B23A2E;
    --brick-deep:#8E2C22;
    --sage:#7E9C87;
    --sage-soft:#C7D8CC;
    --line:#C9D4CD;
    --paper:#FBFCFA;
    --gold:#C79A4B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Noto Sans KR', sans-serif;
    background:var(--mist);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #app{
    max-width:460px;
    margin:0 auto;
    height:100vh;
    height:100dvh;
    position:relative;
    background:var(--paper);
    box-shadow:0 0 40px rgba(28,43,39,0.08);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    opacity:0;
    pointer-events:none;
    transform:translateY(12px);
    transition:opacity .38s ease, transform .38s ease;
  }
  .screen.active{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
  }

  /* ---------- SCREEN 1: START ---------- */
  #screen-start{
    position:relative;
    background:var(--mist);
    justify-content:space-between;
    padding:44px 32px 40px;
    text-align:center;
    overflow:hidden;
  }
  .orb{
    position:absolute;
    border-radius:50%;
    filter:blur(2px);
    pointer-events:none;
  }
  .orb-1{width:220px;height:220px;left:-60px;top:-40px;background:radial-gradient(circle, rgba(126,156,135,0.30), transparent 70%);animation:driftA 9s ease-in-out infinite;}
  .orb-2{width:260px;height:260px;right:-90px;bottom:60px;background:radial-gradient(circle, rgba(178,58,46,0.16), transparent 70%);animation:driftB 11s ease-in-out infinite;}
  @keyframes driftA{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(18px,14px) scale(1.06);}}
  @keyframes driftB{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-14px,-18px) scale(1.04);}}

  .brand-mark{
    font-size:13px;
    letter-spacing:.02em;
    color:var(--ink-soft);
    margin-top:6px;
    position:relative;
    opacity:0;
    animation:fadeUp .6s ease forwards;
  }
  .start-mid{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:18px;
    position:relative;
  }
  .start-illus{width:132px;height:132px;animation:breathe 3.6s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-5px) scale(1.03);}}
  h1.title{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:29px;
    line-height:1.35;
    margin:0;
    color:var(--ink);
    opacity:0;
    animation:fadeUp .6s ease forwards;
    animation-delay:.08s;
  }
  .subtitle{
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink-soft);
    max-width:280px;
    margin:0;
    opacity:0;
    animation:fadeUp .6s ease forwards;
    animation-delay:.18s;
  }
  .scenario-tag{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    color:var(--sage);
    background:var(--sage-soft);
    padding:7px 14px;
    border-radius:100px;
    margin-top:4px;
    opacity:0;
    animation:fadeUp .6s ease forwards;
    animation-delay:.28s;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .start-bottom{display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;opacity:0;animation:fadeUp .6s ease forwards;animation-delay:.38s;}
  .btn-ring-wrap{position:relative;width:126px;height:126px;}
  .btn-ring-wrap::before, .btn-ring-wrap::after{
    content:'';
    position:absolute;inset:0;border-radius:50%;
    border:1.5px solid var(--brick);
    opacity:0;
    pointer-events:none;
    animation:ringPulse 2.6s ease-out infinite;
  }
  .btn-ring-wrap::after{animation-delay:1.3s;}
  @keyframes ringPulse{
    0%{transform:scale(1);opacity:.55;}
    100%{transform:scale(1.45);opacity:0;}
  }
  #btn-start{
    position:relative;
    width:126px;height:126px;border-radius:50%;
    border:none;
    background:linear-gradient(155deg, var(--brick) 0%, var(--brick-deep) 100%);
    color:#fff;
    font-family:'Noto Serif KR',serif;
    font-size:21px;
    font-weight:600;
    letter-spacing:.02em;
    cursor:pointer;
    box-shadow:0 14px 30px -8px rgba(142,44,34,0.55);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  #btn-start:active{transform:scale(0.96);box-shadow:0 8px 18px -6px rgba(142,44,34,0.55);}
  .mic-hint{font-size:12px;color:var(--ink-soft);}

  /* ---------- SCREEN 2: CONVERSATION ---------- */
  #screen-chat{background:var(--paper);}
  .chat-top{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px 12px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .chat-top .who{font-size:14px;font-weight:700;color:var(--ink);}
  .chat-top .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  #btn-force-end{
    font-size:12px;color:var(--brick);background:none;border:1px solid var(--brick);
    padding:6px 12px;border-radius:100px;cursor:pointer;
  }
  .room-stage{
    position:relative;
    flex:1;
    min-height:0;
    max-height:300px;
    background:linear-gradient(180deg, #F1ECE2 0%, #E7DFD0 55%, #DCE7E0 100%);
    overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .room-stage svg{position:absolute;bottom:0;left:0;width:100%;height:100%;}
  .stage-bg-img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;object-position:center center;
    background:transparent;
  }
  .stage-tools{
    position:absolute;top:10px;right:10px;
    display:flex;gap:6px;z-index:5;
  }
  .stage-tool-btn{
    width:32px;height:32px;border-radius:50%;border:none;
    background:rgba(28,43,39,0.55);color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:14px;backdrop-filter:blur(2px);
  }
  .stage-tool-btn svg{width:16px;height:16px;}
  .caption-box{
    position:absolute;left:12px;right:12px;bottom:10px;
    background:rgba(28,43,39,0.78);
    color:#fff;
    font-size:12.5px;
    line-height:1.5;
    padding:8px 12px;
    border-radius:10px;
    min-height:18px;
    backdrop-filter:blur(2px);
  }
  .chat-input-row{
    flex-shrink:0;
    border-top:1px solid var(--line);
    padding:18px 12px calc(20px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    gap:8px;
    align-items:center;
    background:var(--paper);
  }
  #mic-btn{
    width:68px;height:68px;border-radius:50%;flex-shrink:0;
    border:none;background:var(--sage-soft);color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .15s ease;
    box-shadow:0 8px 20px -8px rgba(28,43,39,0.25);
  }
  #mic-btn svg{width:26px;height:26px;}
  #mic-btn.listening{background:var(--brick);color:#fff;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(178,58,46,0.45);}70%{box-shadow:0 0 0 10px rgba(178,58,46,0);}100%{box-shadow:0 0 0 0 rgba(178,58,46,0);}}
  .mic-label{font-size:12px;color:var(--ink-soft);}

  /* ---------- SCREEN 3: RESULT ---------- */
  #screen-result{background:var(--paper);overflow-y:auto;}
  .result-scroll{padding:22px 20px 40px;}
  .result-head{margin-bottom:18px;}
  .result-head .eyebrow{font-size:12px;color:var(--sage);font-weight:700;}
  .result-head h2{
    font-family:'Noto Serif KR',serif;
    font-size:23px;margin:4px 0 0;color:var(--ink);
  }
  .score-total{
    display:flex;align-items:baseline;gap:6px;margin-top:10px;
  }
  .score-total .num{font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:600;color:var(--brick);}
  .score-total .den{font-size:14px;color:var(--ink-soft);}
  #radar-wrap{display:flex;justify-content:center;margin:18px 0 6px;}
  .overall-box{
    background:var(--mist-deep);
    border-radius:14px;
    padding:16px 17px;
    font-size:13.5px;
    line-height:1.7;
    color:var(--ink);
    margin:14px 0 22px;
  }
  .overall-box .label{font-size:11.5px;font-weight:700;color:var(--sage);margin-bottom:6px;display:block;}
  .cat-block{border-top:1px solid var(--line);padding:16px 0;}
  .cat-block:last-child{padding-bottom:0;}
  .cat-block-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .cat-block-head .name{font-weight:700;font-size:14.5px;}
  .cat-block-head .pts{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--brick);}
  .cat-fb{font-size:13px;line-height:1.65;color:var(--ink-soft);margin:0 0 10px;}
  .item-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0;color:var(--ink-soft);}
  .item-row .iname{color:var(--ink);}
  .item-row .iscore{font-family:'IBM Plex Mono',monospace;flex-shrink:0;}
  .result-actions{display:flex;gap:10px;margin-top:26px;}
  .btn-outline{
    flex:1;padding:13px;border-radius:100px;border:1px solid var(--ink);
    background:none;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink);
    font-family:inherit;
  }

  .loading-overlay{
    position:absolute;inset:0;background:rgba(251,252,250,0.92);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    z-index:20;
  }
  .loading-overlay.hidden{display:none;}
  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:3px solid var(--sage-soft);border-top-color:var(--brick);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-text{font-size:13px;color:var(--ink-soft);}
  .err-box{
    position:absolute;left:16px;right:16px;bottom:80px;
    background:#fff3f1;border:1px solid var(--brick);color:var(--brick-deep);
    font-size:12.5px;padding:10px 13px;border-radius:10px;display:none;
  }
</style>
</head>
<body>
<div id="app">

  <!-- SCREEN 1 -->
  <section id="screen-start" class="screen active">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="brand-mark">하이케어솔루션 · 인재육성팀</div>
    <div class="start-mid">
      <svg class="start-illus" viewBox="0 0 132 132" fill="none">
        <circle cx="66" cy="66" r="64" fill="#DCE7E0"/>
        <path d="M66 30 C50 54 40 68 40 82 C40 100 51 112 66 112 C81 112 92 100 92 82 C92 68 82 54 66 30 Z" fill="#FBFCFA" stroke="#7E9C87" stroke-width="2.5"/>
        <path d="M66 46 C56 62 50 72 50 82 C50 92 57 100 66 100" stroke="#C7D8CC" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
        <circle cx="66" cy="86" r="6" fill="#B23A2E"/>
      </svg>
      <h1 class="title">입문매니저<br>CS 역량 평가</h1>
    </div>
    <div class="start-bottom">
      <div class="btn-ring-wrap">
        <button id="btn-start">시작</button>
      </div>
      <div class="mic-hint">버튼을 누르면 마이크 사용 동의를 요청합니다</div>
    </div>
  </section>

  <!-- SCREEN 2 -->
  <section id="screen-chat" class="screen">
    <div class="chat-top">
      <div>
        <div class="who">고객 가정 방문 중</div>
        <div class="sub">정수기 정기 케어서비스 · 진행 시간 <span id="elapsed">00:00</span></div>
      </div>
      <button id="btn-force-end">대화 종료</button>
    </div>
    <div class="room-stage">
      <div class="stage-tools">
        <button class="stage-tool-btn" id="bg-upload-btn" title="배경 이미지 직접 업로드">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 15l-5-5-4 4-3-3-5 5"/></svg>
        </button>
        <button class="stage-tool-btn" id="bg-reset-btn" title="기본 일러스트로 되돌리기" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <input type="file" id="bg-upload-input" accept="image/*" style="display:none;">
      </div>
      <img class="stage-bg-img" id="stage-bg-img" style="display:none;" alt="업로드한 배경 이미지">
      <svg id="stage-illus" viewBox="0 0 400 190" preserveAspectRatio="xMidYMid meet">
        <!-- 벽/선반 -->
        <rect x="0" y="0" width="400" height="190" fill="#F2ECE0"/>
        <rect x="0" y="24" width="400" height="6" fill="#DCCFB6"/>
        <rect x="14" y="2" width="10" height="22" rx="2" fill="#FBFCFA" stroke="#D8CBB0" stroke-width="1"/>
        <rect x="28" y="6" width="10" height="18" rx="2" fill="#FBFCFA" stroke="#D8CBB0" stroke-width="1"/>
        <ellipse cx="365" cy="16" rx="18" ry="9" fill="#8A6A3E" opacity="0.6"/>

        <!-- 화분 (왼쪽 끝) -->
        <rect x="2" y="132" width="14" height="18" rx="2" fill="#EAF0EA" stroke="#C7D2CB" stroke-width="1.2"/>
        <path d="M9 132 Q2 118 4 104 M9 132 Q10 112 16 100 M9 132 Q16 120 20 108" stroke="#7E9C87" stroke-width="2.4" fill="none" stroke-linecap="round"/>

        <!-- 아일랜드 조리대 -->
        <rect x="0" y="150" width="400" height="40" fill="#C7D2CB"/>
        <rect x="0" y="150" width="400" height="8" fill="#DCE4DF"/>

        <!-- 정수기 (중앙) -->
        <g>
          <rect x="171" y="60" width="58" height="92" rx="9" fill="#FBFCFA" stroke="#B7C4BC" stroke-width="2.5"/>
          <rect x="181" y="70" width="38" height="22" rx="3" fill="#3B4642"/>
          <text x="200" y="85" font-size="9" fill="#EAF1EC" text-anchor="middle" font-family="'Noto Sans KR', sans-serif">정수</text>
          <circle cx="189" cy="102" r="4" fill="#E3EAE5" stroke="#B7C4BC" stroke-width="1"/>
          <circle cx="200" cy="102" r="4" fill="#E3EAE5" stroke="#B7C4BC" stroke-width="1"/>
          <circle cx="211" cy="102" r="4" fill="#E3EAE5" stroke="#B7C4BC" stroke-width="1"/>
          <rect x="191" y="122" width="18" height="10" rx="2" fill="#E3EAE5" stroke="#B7C4BC" stroke-width="1.5"/>
          <rect x="187" y="152" width="26" height="9" rx="2" fill="#E3EAE5" stroke="#B7C4BC" stroke-width="1.5"/>
        </g>

        <!-- 고객 (왼쪽) -->
        <g id="avatar-customer">
          <ellipse cx="100" cy="188" rx="48" ry="8" fill="#00000010"/>
          <path d="M62 188 Q58 136 100 128 Q142 136 138 188 Z" fill="#E4D9BE"/>
          <path d="M74 150 Q66 176 78 188" stroke="#3B2E24" stroke-width="10" fill="none" stroke-linecap="round"/>
          <path d="M126 150 Q134 176 122 188" stroke="#3B2E24" stroke-width="10" fill="none" stroke-linecap="round"/>
          <circle cx="100" cy="112" r="20" fill="#F0C9A8"/>
          <path d="M78 108 Q76 82 100 80 Q124 82 122 108 Q124 130 118 140 Q122 112 100 110 Q78 112 82 140 Q76 130 78 108 Z" fill="#3B2E24"/>
          <path d="M80 112 Q72 138 82 156" stroke="#2E2219" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85"/>
          <path d="M120 112 Q129 136 120 156" stroke="#2E2219" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85"/>
          <path d="M85 116 Q80 136 88 152" stroke="#4A392C" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.7"/>
          <circle cx="93" cy="114" r="1.7" fill="#3B2A22"/>
          <circle cx="109" cy="114" r="1.7" fill="#3B2A22"/>
          <path d="M94 122 Q100 126 108 122" stroke="#B26B55" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        </g>

        <!-- 매니저 (오른쪽, 정수기 안내 중) -->
        <g id="avatar-manager">
          <ellipse cx="300" cy="188" rx="52" ry="8" fill="#00000012"/>
          <path d="M268 188 Q264 138 300 132 Q336 138 332 188 Z" fill="#8A97A0"/>
          <path d="M284 140 L300 152 L316 140 L310 133 L290 133 Z" fill="#B23A2E"/>
          <path d="M290 133 L300 152" stroke="#D98A7A" stroke-width="1.4" opacity="0.7"/>
          <path d="M310 133 L300 152" stroke="#D98A7A" stroke-width="1.4" opacity="0.7"/>
          <rect x="312" y="150" width="9" height="12" rx="2" fill="#FBFCFA" stroke="#9FB0A6" stroke-width="1"/>
          <circle cx="300" cy="112" r="19" fill="#F3CBA8"/>
          <path d="M281 108 Q281 88 300 88 Q319 88 319 108 Q319 96 300 96 Q281 96 281 108 Z" fill="#2A211B"/>
          <circle cx="311" cy="103" r="6" fill="#2A211B"/>
          <circle cx="293" cy="114" r="1.7" fill="#2A211B"/>
          <circle cx="307" cy="114" r="1.7" fill="#2A211B"/>
          <path d="M292 121 Q300 126 308 121" stroke="#8E5A3E" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <path d="M268 156 Q236 132 224 90" stroke="#8A97A0" stroke-width="13" fill="none" stroke-linecap="round"/>
          <circle cx="223" cy="86" r="7" fill="#F3CBA8"/>
        </g>

        <!-- 개수대 (오른쪽) -->
        <path d="M385 146 L385 120 Q385 108 373 108 L360 108" stroke="#9FB0A6" stroke-width="4" fill="none" stroke-linecap="round"/>
        <circle cx="385" cy="146" r="3" fill="#9FB0A6"/>
        <rect x="345" y="152" width="42" height="9" rx="2" fill="#DCE4DF" stroke="#B7C4BC" stroke-width="1"/>
        <line x1="350" y1="152" x2="350" y2="141" stroke="#B7C4BC" stroke-width="1.5"/>
        <line x1="358" y1="152" x2="358" y2="139" stroke="#B7C4BC" stroke-width="1.5"/>
        <line x1="366" y1="152" x2="366" y2="142" stroke="#B7C4BC" stroke-width="1.5"/>
      </svg>
      <div class="caption-box" id="caption">정수기 앞에서 매니저가 되어 첫인사를 건네 보세요</div>
    </div>
    <div class="err-box" id="err-box"></div>
    <div class="chat-input-row">
      <button id="mic-btn" title="음성 입력">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z"/><path d="M19 11a1 1 0 00-2 0 5 5 0 01-10 0 1 1 0 00-2 0 7 7 0 006 6.93V20H9a1 1 0 000 2h6a1 1 0 000-2h-2v-2.07A7 7 0 0019 11z"/></svg>
      </button>
      <div class="mic-label" id="mic-label">마이크를 눌러 말씀해 주세요</div>
    </div>
  </section>

  <!-- SCREEN 3 -->
  <section id="screen-result" class="screen">
    <div class="result-scroll">
      <div class="result-head">
        <span class="eyebrow">평가 결과</span>
        <h2>오늘 방문 상담 피드백</h2>
        <div class="score-total"><span class="num" id="total-score">-</span><span class="den">/ 30점</span></div>
      </div>
      <div id="radar-wrap"></div>
      <div class="overall-box">
        <span class="label">종합 총평</span>
        <span id="overall-text">채점 중입니다...</span>
      </div>
      <div id="category-list"></div>
      <div class="result-actions">
        <button class="btn-outline" id="btn-restart">다시 도전하기</button>
      </div>
    </div>
  </section>

  <div class="loading-overlay hidden" id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">채점 중입니다...</div>
  </div>

</div>

<script>
/* =========================================================
   0. 평가 기준 데이터

/* --- Gemini(구글) API 키 ---
   아래 따옴표 사이에 발급받은 키를 그대로 붙여넣으세요 (예: 'AIzaSy...').
   Google AI Studio(aistudio.google.com/apikey)에서 카드 등록 없이 무료로 발급 가능합니다.
   ⚠️ 주의: 이 방식은 키가 이 파일(소스코드) 안에 그대로 노출됩니다.
   누구든 이 페이지의 소스보기로 키를 볼 수 있고, 그 키로 자신의 요청을 보낼 수도 있어요.
   내부 소수 인원만 쓰는 데모용으로는 괜찮지만, 불특정 다수에게 공개 배포하는 경우
   키를 서버 쪽에 숨기는 방식으로 바꾸는 걸 권장합니다. */
const GEMINI_API_KEY = 'AQ.Ab8RN6JqWHNnnD9blDW9iz_9XfCR44ujfnGVF5jHZt-WY33mXQ';

function getApiKey(){
  return GEMINI_API_KEY;
}

async function callClaude(system, messages, maxTokens){
  const key = getApiKey();
  if(!key || key === '여기에_발급받은_키를_붙여넣으세요'){
    throw new Error('Gemini API 키가 설정되지 않았습니다. 코드 상단의 GEMINI_API_KEY 값을 채워주세요.');
  }
  const contents = messages.map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }]
  }));
  const res = await fetch(
    'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=' + encodeURIComponent(key),
    {
      method:'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        contents: contents,
        systemInstruction: { parts: [{ text: system }] },
        generationConfig: { maxOutputTokens: maxTokens || 300 }
      })
    }
  );
  if(!res.ok){
    let detail = '';
    try{
      const errJson = await res.json();
      detail = errJson && errJson.error && errJson.error.message ? errJson.error.message : '';
    }catch(e){ /* 무시 */ }
    if(res.status === 400 && /API key/i.test(detail)){
      throw new Error('Gemini API 키가 올바르지 않아요. 코드 상단의 GEMINI_API_KEY 값을 다시 확인해 주세요.');
    }
    throw new Error('API 오류 (' + res.status + ')' + (detail ? ': ' + detail : ''));
  }
  const data = await res.json();
  const cand = data.candidates && data.candidates[0];
  const parts = cand && cand.content && cand.content.parts;
  const text = parts ? parts.map(p=>p.text||'').join('') : '';
  if(!text){
    const blockReason = data.promptFeedback && data.promptFeedback.blockReason;
    throw new Error('Gemini가 응답을 만들지 못했어요' + (blockReason ? ' (' + blockReason + ')' : ''));
  }
  return text;
}

let history = [];
let conversationEnded = false;
let recognizing = false;
let recognition = null;
let wantListening = false;   // 사용자가 마이크를 켜둔 상태를 유지하고 싶어하는지
let processing = false;      // AI 응답 생성/재생 중인지 (이 동안은 자동 재시작 안 함)
let noSpeechStreak = 0;      // 연속으로 아무 소리도 못 들은 횟수
let startTime = null;
let timerInt = null;

function fmtTime(ms){
  const s = Math.floor(ms/1000);
  const mm = String(Math.floor(s/60)).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');
  return mm+':'+ss;
}
function startTimer(){
  startTime = Date.now();
  timerInt = setInterval(()=>{
    document.getElementById('elapsed').textContent = fmtTime(Date.now()-startTime);
  }, 1000);
}
function stopTimer(){ clearInterval(timerInt); }

function setCaption(text){
  document.getElementById('caption').textContent = text;
}
function setMicLabel(text){
  document.getElementById('mic-label').textContent = text;
}

function speak(text){
  return new Promise(resolve=>{
    if(!('speechSynthesis' in window)){ resolve(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    const voices = speechSynthesis.getVoices();
    const preferred = voices.find(v=>v.lang && v.lang.startsWith('ko') && /female|여성|유나|아름|나라|Yuna/i.test(v.name));
    const anyKo = voices.find(v=>v.lang && v.lang.startsWith('ko'));
    u.voice = preferred || anyKo || null;
    u.rate = 0.98;
    u.pitch = 1.06;
    u.onend = resolve;
    u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}

const FAREWELL_PATTERNS = [/다음\s*방문/, /좋은\s*하루/, /감사합니다.*뵙겠/, /안녕히\s*계세요/, /또\s*뵙겠/];
function looksLikeFarewell(text){
  return FAREWELL_PATTERNS.some(p=>p.test(text));
}

async function handleManagerUtterance(text){
  if(!text || !text.trim() || conversationEnded) return;
  processing = true;
  setCaption('매니저 발화를 확인했어요');
  setMicLabel('고객이 답변을 준비하고 있어요...');
  history.push({role:'user', content:text});

  const willEnd = looksLikeFarewell(text);

  try{
    let reply = await callClaude(PERSONA_SYSTEM, history, 200);
    // 한글이 전혀 없이(영어 등으로) 응답이 오면 한 번만 다시 요청
    if(!/[가-힣]/.test(reply)){
      history.push({role:'assistant', content:reply});
      history.push({role:'user', content:'(반드시 한국어로만 다시 답해주세요)'});
      reply = await callClaude(PERSONA_SYSTEM, history, 200);
      history.pop(); history.pop();
    }
    setCaption('고객이 답변하고 있어요');
    history.push({role:'assistant', content:reply});
    await speak(reply);
    setCaption('말씀해 주세요');
  }catch(e){
    showErr('고객 응답을 불러오지 못했습니다: ' + (e && e.message ? e.message : e));
  }
  setMicLabel('마이크를 눌러 말씀해 주세요');
  processing = false;

  if(willEnd){
    setCaption('작별 인사가 감지되어 상담을 종료합니다.');
    endConversation();
    return;
  }

  // 답변 재생이 끝났으면, 사용자가 마이크를 계속 켜둔 상태였을 때 자동으로 다시 듣기 시작
  if(wantListening && !recognizing && recognition){
    try{ recognition.start(); }catch(e){}
  }
}

function endConversation(){
  if(conversationEnded) return;
  conversationEnded = true;
  wantListening = false;
  stopTimer();
  if(recognizing && recognition) recognition.stop();
  runScoring();
}

/* --- STT --- */
function micErrorMessage(code){
  switch(code){
    case 'not-allowed':
    case 'permission-denied':
      return '마이크 권한이 차단되어 있어요. 브라우저 주소창의 자물쇠(사이트 정보) 아이콘에서 마이크 권한을 허용한 뒤 다시 시도해 주세요.';
    case 'service-not-allowed':
      return '이 화면(미리보기 창) 안에서는 마이크 접근이 막혀 있을 수 있어요. 다운로드한 파일을 Chrome에서 직접 열어 다시 시도해 주세요.';
    case 'audio-capture':
      return '사용 가능한 마이크를 찾지 못했어요. 마이크 연결 상태를 확인해 주세요.';
    case 'network':
      return '음성 인식 서비스에 연결하지 못했어요. 네트워크 상태를 확인해 주세요.';
    case 'no-speech':
      return null; // 조용해서 인식 못 한 것은 에러로 보여줄 필요 없음
    default:
      return '음성 인식을 시작하지 못했어요 (' + (code||'알 수 없는 오류') + '). Chrome에서 이 파일을 직접 열어 다시 시도해 주세요.';
  }
}
function setupRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  const r = new SR();
  r.lang = 'ko-KR';
  r.continuous = false; // 안드로이드에서는 continuous=true일 때 '최종 인식'이 오지 않는 경우가 많아 false로 유지 (대신 onend에서 자동 재시작)
  r.interimResults = true;
  r.onstart = ()=>{
    recognizing = true;
    document.getElementById('mic-btn').classList.add('listening');
    setCaption('듣고 있어요...');
  };
  r.onend = ()=>{
    recognizing = false;
    document.getElementById('mic-btn').classList.remove('listening');
    // 사용자가 끄지 않았고, 답변 처리 중도 아닌데 인식이 끊겼다면 자동으로 다시 듣기 시작
    if(wantListening && !processing && !conversationEnded){
      setTimeout(()=>{
        if(wantListening && !processing && !conversationEnded){
          try{ recognition.start(); }catch(e){}
        }
      }, 250);
    }
  };
  r.onerror = (ev)=>{
    recognizing = false;
    document.getElementById('mic-btn').classList.remove('listening');
    const code = ev && ev.error;
    if(code === 'aborted'){ return; }
    if(code === 'no-speech'){
      noSpeechStreak++;
      if(noSpeechStreak >= 4){
        noSpeechStreak = 0;
        wantListening = false;
        showErr('마이크가 소리를 전혀 인식하지 못하고 있어요. 안드로이드 설정 → 앱 → Chrome → 권한 → 마이크가 켜져 있는지, 다른 앱이 마이크를 쓰고 있진 않은지 확인해 주세요.');
      }
      return; // 그 전까지는 자동 재시작에 맡김
    }
    noSpeechStreak = 0;
    wantListening = false;
    const msg = micErrorMessage(code);
    if(msg) showErr(msg);
  };
  r.onresult = (ev)=>{
    let hasInterim = false, final = '';
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      if(ev.results[i].isFinal) final += ev.results[i][0].transcript;
      else hasInterim = true;
    }
    if(hasInterim || final){ noSpeechStreak = 0; }
    if(hasInterim) setCaption('듣고 있어요...');
    if(final && final.trim()){
      try{ r.stop(); }catch(e){}
      handleManagerUtterance(final.trim());
    }
  };
  return r;
}

document.getElementById('mic-btn').addEventListener('click', ()=>{
  if(conversationEnded) return;
  if(!recognition){
    showErr('이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 브라우저에서 열어 주세요.');
    return;
  }
  if(recognizing){
    wantListening = false;
    recognition.stop();
    setMicLabel('마이크를 눌러 말씀해 주세요');
    return;
  }
  wantListening = true;
  noSpeechStreak = 0;
  try{
    recognition.start();
  }catch(e){
    wantListening = false;
    showErr(micErrorMessage(e && e.name) || ('음성 인식을 시작하지 못했어요: ' + (e && e.message ? e.message : e)));
  }
});
document.getElementById('btn-force-end').addEventListener('click', ()=>{

});

function extractJson(text){
  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  if(start === -1 || end === -1) throw new Error('JSON 파싱 실패');
  return JSON.parse(text.slice(start, end+1));
}

async function runScoring(){
  setLoading(true, '대화 내용을 분석해 채점하고 있습니다...');
  try{
    const transcriptText = history.map(h => (h.role==='user' ? '매니저: ' : '고객: ') + h.content).join('\n');
    const scoreSystem = buildScoringSystemPrompt();
    const raw = await callClaude(scoreSystem, [{role:'user', content:'대화록:\n'+transcriptText}], 1200);
    const parsed = extractJson(raw);
    renderResult(parsed);
  }catch(e){
    renderResultFallback();
  }
  setLoading(false);
  showScreen('result');
}

function renderResult(parsed){
  const scoreMap = {};
  (parsed.items||[]).forEach(it=>{ scoreMap[it.id] = it; });

  const catTotals = {};
  CATEGORY_ORDER.forEach(c=>catTotals[c]=0);
  let total = 0;
  CRITERIA.forEach(c=>{
    const s = scoreMap[c.id] ? Number(scoreMap[c.id].score) : 0;
    const clamped = Math.max(0, Math.min(c.max, isNaN(s)?0:s));
    catTotals[c.category] += clamped;
    total += clamped;
  });

  document.getElementById('total-score').textContent = total;
  document.getElementById('overall-text').textContent = parsed.overall || '총평을 생성하지 못했습니다.';

  drawRadar(catTotals);

  const listEl = document.getElementById('category-list');
  listEl.innerHTML = '';
  CATEGORY_ORDER.forEach(cat=>{
    const items = CRITERIA.filter(c=>c.category===cat);
    const block = document.createElement('div');
    block.className = 'cat-block';
    const fb = (parsed.categories && parsed.categories[cat]) ? parsed.categories[cat] : '';
    block.innerHTML = `
      <div class="cat-block-head">
        <span class="name">${cat}</span>
        <span class="pts">${catTotals[cat]} / ${CATEGORY_MAX[cat]}</span>
      </div>
      <p class="cat-fb">${fb}</p>
      ${items.map(it=>{
        const sc = scoreMap[it.id] ? scoreMap[it.id].score : 0;
        const cm = scoreMap[it.id] ? (scoreMap[it.id].comment||'') : '';
        return `<div class="item-row"><span class="iname">${it.name}${cm? ' · '+cm : ''}</span><span class="iscore">${sc}/${it.max}</span></div>`;
      }).join('')}
    `;
    listEl.appendChild(block);
  });
}

function renderResultFallback(){
  document.getElementById('total-score').textContent = '-';
  document.getElementById('overall-text').textContent = '채점 응답을 불러오지 못했습니다. 네트워크 상태를 확인한 뒤 다시 시도해 주세요.';
  drawRadar(Object.fromEntries(CATEGORY_ORDER.map(c=>[c,0])));
  document.getElementById('category-list').innerHTML = '';
}

function drawRadar(catTotals){
  const size = 240, cx = size/2, cy = size/2, r = 88;
  const n = CATEGORY_ORDER.length;
  const angle = (i)=> -Math.PI/2 + i*(2*Math.PI/n);
  function pt(i, ratio){
    const a = angle(i);
    return [cx + r*ratio*Math.cos(a), cy + r*ratio*Math.sin(a)];
  }
  let gridPolys = '';
  [0.25,0.5,0.75,1].forEach(ratio=>{
    const pts = CATEGORY_ORDER.map((c,i)=>pt(i,ratio).join(',')).join(' ');
    gridPolys += `<polygon points="${pts}" fill="none" stroke="#C9D4CD" stroke-width="1"/>`;
  });
  let axes = '';
  CATEGORY_ORDER.forEach((c,i)=>{
    const [x,y] = pt(i,1);
    axes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#C9D4CD" stroke-width="1"/>`;
  });
  const dataPts = CATEGORY_ORDER.map((c,i)=>{
    const ratio = CATEGORY_MAX[c] ? catTotals[c]/CATEGORY_MAX[c] : 0;
    return pt(i, ratio);
  });
  const dataPoly = dataPts.map(p=>p.join(',')).join(' ');
  let labels = '';
  CATEGORY_ORDER.forEach((c,i)=>{
    const [x,y] = pt(i, 1.28);
    labels += `<text x="${x}" y="${y}" font-size="11" fill="#4C5C57" text-anchor="middle" dominant-baseline="middle" font-family="Noto Sans KR, sans-serif">${c}</text>`;
  });
  const svg = `<svg width="${size+60}" height="${size+40}" viewBox="0 0 ${size+60} ${size+40}">
    <g transform="translate(30,20)">
      ${gridPolys}
      ${axes}
      <polygon points="${dataPoly}" fill="#B23A2E" fill-opacity="0.28" stroke="#B23A2E" stroke-width="2"/>
      ${dataPts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#B23A2E"/>`).join('')}
      ${labels}
    </g>
  </svg>`;
  document.getElementById('radar-wrap').innerHTML = svg;
}

    img.style.display = 'block';
    illus.style.display = 'none';
    resetBtn.style.display = 'flex';
  }
  function showIllus(){
    img.style.display = 'none';
    img.src = '';
    illus.style.display = 'block';
    resetBtn.style.display = 'none';
  }

  // (1) 저장소에 assets/scene.* 파일이 있으면 자동으로 적용
  function tryStaticBg(i){
    if(i >= STATIC_BG_CANDIDATES.length) return;
    const probe = new Image();
    probe.onload = function(){
      staticBgApplied = true;
      resolvedStaticSrc = STATIC_BG_CANDIDATES[i];
      showImg(resolvedStaticSrc);
    };
    probe.onerror = function(){ tryStaticBg(i+1); };
    probe.src = STATIC_BG_CANDIDATES[i];
  }
  tryStaticBg(0);

  // (2) 브라우저에서 즉석으로 다른 이미지를 올려 미리 보기 (정적 파일보다 우선 적용)
  uploadBtn.addEventListener('click', ()=> input.click());
  input.addEventListener('change', ()=>{
    const file = input.files && input.files[0];
    if(!file) return;
    if(objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(file);
    showImg(objectUrl);
  });
  resetBtn.addEventListener('click', ()=>{
    if(objectUrl){ URL.revokeObjectURL(objectUrl); objectUrl = null; }
    input.value = '';
    // 정적 배경이 적용되어 있었다면 그걸로, 아니면 기본 일러스트로 되돌림
    if(staticBgApplied){ showImg(resolvedStaticSrc); }
    else{ showIllus(); }
  });
})();

if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = ()=>{ speechSynthesis.getVoices(); };
}
</script>
</body>
</html>
